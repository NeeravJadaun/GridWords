name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (format, build, unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --severity warn

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/WordDuel.UnitTests/WordDuel.UnitTests.csproj --no-build -c Release --logger "console;verbosity=normal"

      - name: Integration tests (Testcontainers: Postgres + Redis)
        run: dotnet test tests/WordDuel.IntegrationTests/WordDuel.IntegrationTests.csproj -c Release --logger "console;verbosity=normal"

  frontend:
    name: Client (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/word-duel-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/word-duel-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack
        run: docker compose up -d --build
        env:
          JWT_SIGNING_KEY: ci-signing-key-at-least-32-bytes-long-for-tests

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5080/ready > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 3
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/word-duel-e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/word-duel-e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/word-duel-e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3100

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/word-duel-e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
